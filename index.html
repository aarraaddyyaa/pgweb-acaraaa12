<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS GeoServer - DIY</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html,
        body,
        #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* Mengubah warna layer jalan dari merah menjadi abu-abu */
        .layer-jalan-abu {
            filter: grayscale(100%) brightness(85%);
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Cukup Leaflet JS saja, tanpa L.Geoserver.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inisialisasi Peta (Koordinat Sleman/DIY)
        var map = L.map("map").setView([-7.677567, 110.406899], 11);

        // Basemap OpenStreetMap
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Membuat Pane khusus untuk mengatur urutan tumpukan visual (Bawah ke Atas)
        map.createPane("panePoligon").style.zIndex = 410;
        map.createPane("paneGaris").style.zIndex = 420;
        map.createPane("paneTitik").style.zIndex = 430;

        // Layer Poligon: Batas Administrasi DIY (Diubah ke L.tileLayer.wms)
        var wmsLayer1 = L.tileLayer.wms("http://localhost:8080/geoserver/wms", {
            layers: "ne:DIY",
            styles: "batas_administrasi_DIY_A11",
            format: "image/png",
            transparent: true,
            pane: "panePoligon"
        }).addTo(map);

        // Layer Garis: Jalan Kabupaten Sleman (Diubah ke L.tileLayer.wms)
        var wmsLayer2 = L.tileLayer.wms("https://geoportal.slemankab.go.id/geoserver/wms", {
            layers: "geonode:jalan_kabupaten_sleman_2023",
            format: "image/png",
            transparent: true,
            className: "layer-jalan-abu",
            pane: "paneGaris"
        }).addTo(map);

        // Layer Titik: Sebaran Sampah 
        var wmsLayer4 = L.tileLayer.wms("http://localhost:8080/geoserver/pgwb12/wms", {
            layers: "pgwb12:sebaran_sampah",
            styles: "style_persampahan",
            format: "image/png",
            version: "1.1.0",
            transparent: true,
            tileSize: 2048,
            pane: "paneTitik"
        }).addTo(map);

        // Legenda Gabungan (Sebaran Sampah & Batas Administrasi DIY)
        var customLegend = L.control({ position: "bottomleft" });

        customLegend.onAdd = function () {
            var div = L.DomUtil.create("div", "info legend");
            div.style.cssText = "background:white; padding:10px; border-radius:5px; box-shadow:0 0 10px rgba(0,0,0,0.2); line-height:1.5; max-height:350px; overflow-y:auto;";

            // Judul & Simbol Sebaran Sampah
            div.innerHTML =
                "<strong>Sebaran Sampah</strong>" +
                "<img src='http://localhost:8080/geoserver/pgwb12/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=pgwb12:sebaran_sampah&STYLE=style_persampahan&LEGEND_OPTIONS=dpi:180' style='zoom:0.5; display:block; margin: 4px 0 8px 0;'>" +
                "<strong>Kecamatan</strong>" +
                "<img src='http://localhost:8080/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&LAYER=ne:DIY&STYLE=batas_administrasi_DIY_A11&LEGEND_OPTIONS=dpi:180' style='zoom:0.5; display:block; margin-top:4px;'>";

            return div;
        };

        customLegend.addTo(map);

        // Kontrol Layer (Diurutkan: Titik -> Garis -> Poligon)
        L.control.layers(
            { "OpenStreetMap": osm },
            {
                "Sebaran Sampah": wmsLayer4,
                "Jalan": wmsLayer2,
                "Batas Administrasi DIY": wmsLayer1
            }
        ).addTo(map);
    </script>
</body>

</html>
